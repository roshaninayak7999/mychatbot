
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI Chatbot</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.app {
    width: 100%;
    max-width: 900px;
    height: 92vh;
    background: #fff;
    border-radius: 22px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 25px 70px rgba(0,0,0,.25);
}

/* Header */
.header {
    height: 72px;
    padding: 10px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #eee;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: linear-gradient(135deg,#667eea,#764ba2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
}

.title {
    font-size: 18px;
    font-weight: bold;
}

.online {
    color: #22a05a;
    font-size: 12px;
    margin-top: 3px;
}

.clear {
    border: none;
    background: #f1f3f5;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 18px;
}

/* Chat */
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
    background: #f6f7fb;
}

.message {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    max-width: 85%;
}

.message.user {
    margin-left: auto;
    flex-direction: row-reverse;
}

.avatar {
    width: 38px;
    height: 38px;
    min-width: 38px;
    border-radius: 50%;
    background: #667eea;
    display: flex;
    align-items: center;
    justify-content: center;
}

.content {
    display: flex;
    flex-direction: column;
}

.user .content {
    align-items: flex-end;
}

.bubble {
    padding: 13px 17px;
    border-radius: 17px;
    line-height: 1.55;
    font-size: 15px;
    white-space: pre-wrap;
    word-break: break-word;
}

.bot .bubble {
    background: white;
    color: #222;
    border-top-left-radius: 4px;
    box-shadow: 0 2px 10px rgba(0,0,0,.05);
}

.user .bubble {
    background: #667eea;
    color: white;
    border-top-right-radius: 4px;
}

.time {
    color: #999;
    font-size: 10px;
    margin-top: 5px;
}

/* Typing */
.typing {
    display: none;
    padding: 9px 25px;
    background: #f6f7fb;
    color: #777;
    font-size: 13px;
}

.typing.show {
    display: block;
}

/* Input */
.input-area {
    display: flex;
    gap: 10px;
    padding: 15px;
    border-top: 1px solid #eee;
}

.input {
    flex: 1;
    height: 50px;
    border: 1px solid #ddd;
    border-radius: 25px;
    padding: 0 18px;
    outline: none;
    font-size: 15px;
}

.input:focus {
    border-color: #667eea;
}

.send {
    width: 50px;
    height: 50px;
    border: none;
    border-radius: 50%;
    background: #667eea;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.send:disabled {
    opacity: .5;
    cursor: not-allowed;
}

@media(max-width:600px) {
    body {
        padding: 0;
    }

    .app {
        height: 100vh;
        border-radius: 0;
    }

    .chat {
        padding: 15px;
    }

    .message {
        max-width: 94%;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="brand">

            <div class="logo">🤖</div>

            <div>
                <div class="title">My AI Chatbot</div>
                <div class="online">● Groq AI</div>
            </div>

        </div>

        <button class="clear" onclick="clearChat()">
            🗑️
        </button>

    </header>


    <main class="chat" id="chat">

        <div class="message bot">

            <div class="avatar">🤖</div>

            <div class="content">

                <div class="bubble">Hello! 👋

I'm your AI assistant powered by Groq.

Ask me anything!</div>

                <div class="time">Now</div>

            </div>

        </div>

    </main>


    <div class="typing" id="typing">
        🤖 AI is thinking...
    </div>


    <div class="input-area">

        <input
            id="input"
            class="input"
            type="text"
            placeholder="Message your AI..."
            autocomplete="off"
        >

        <button
            id="send"
            class="send"
            onclick="sendMessage()"
        >
            ➤
        </button>

    </div>

</div>


<script>

/*
==================================================
 GROQ CONFIGURATION
==================================================

IMPORTANT:
Do NOT use the keys you already posted.

Create/rotate a NEW Groq key and put it below
ONLY for local testing.

A key inside a public GitHub Pages file can
be copied by anyone.
==================================================
*/

const GROQ_API_KEY = "PASTE_NEW_KEY_HERE";

const MODEL = "llama-3.3-70b-versatile";

const GROQ_URL =
    "https://api.groq.com/openai/v1/chat/completions";


/*
==================================================
 ELEMENTS
==================================================
*/

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("input");

const send =
    document.getElementById("send");

const typing =
    document.getElementById("typing");


/*
==================================================
 CONVERSATION
==================================================
*/

let conversation = [];


/*
==================================================
 ENTER KEY
==================================================
*/

input.addEventListener("keydown", function(e) {

    if (e.key === "Enter") {
        e.preventDefault();
        sendMessage();
    }

});


/*
==================================================
 SEND MESSAGE
==================================================
*/

async function sendMessage() {

    const text = input.value.trim();

    if (!text) return;


    if (
        GROQ_API_KEY === "" ||
        GROQ_API_KEY === "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"
    ) {

        addMessage(
            "bot",
            "⚠️ Add your new Groq API key to GROQ_API_KEY first."
        );

        return;
    }


    addMessage("user", text);

    input.value = "";


    conversation.push({
        role: "user",
        content: text
    });


    send.disabled = true;

    typing.classList.add("show");


    try {

        const response = await fetch(
            GROQ_URL,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "Authorization":
                        "Bearer " + GROQ_API_KEY
                },

                body: JSON.stringify({

                    model: MODEL,

                    messages: [
                        {
                            role: "system",
                            content:
                                "You are a helpful, friendly AI assistant. Answer clearly and accurately. Use plain text and simple formatting."
                        },

                        ...conversation
                    ],

                    temperature: 0.7,

                    max_tokens: 2048

                })
            }
        );


        const data = await response.json();


        if (!response.ok) {

            throw new Error(
                data?.error?.message ||
                "Groq API request failed."
            );

        }


        const answer =
            data?.choices?.[0]?.message?.content;


        if (!answer) {

            throw new Error(
                "The AI returned an empty response."
            );

        }


        conversation.push({
            role: "assistant",
            content: answer
        });


        addMessage("bot", answer);


    } catch (error) {

        console.error(error);

        addMessage(
            "bot",
            "❌ " + error.message
        );

    }


    typing.classList.remove("show");

    send.disabled = false;

    input.focus();

}


/*
==================================================
 ADD MESSAGE
==================================================
*/

function addMessage(sender, text) {

    const message =
        document.createElement("div");

    message.className =
        "message " + sender;


    const avatar =
        document.createElement("div");

    avatar.className = "avatar";

    avatar.textContent =
        sender === "user"
        ? "👤"
        : "🤖";


    const content =
        document.createElement("div");

    content.className = "content";


    const bubble =
        document.createElement("div");

    bubble.className = "bubble";

    /*
    textContent is used instead of innerHTML
    so AI output cannot inject arbitrary HTML.
    */

    bubble.textContent = text;


    const time =
        document.createElement("div");

    time.className = "time";

    time.textContent =
        new Date().toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    content.appendChild(bubble);
    content.appendChild(time);

    message.appendChild(avatar);
    message.appendChild(content);

    chat.appendChild(message);


    chat.scrollTop =
        chat.scrollHeight;

}


/*
==================================================
 CLEAR CHAT
==================================================
*/

function clearChat() {

    conversation = [];

    chat.innerHTML = "";

    addMessage(
        "bot",
        "Chat cleared! 👋\n\nHow can I help you?"
    );

}


/*
==================================================
 START
==================================================
*/

input.focus();

</script>

</body>
</html>

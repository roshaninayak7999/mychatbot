```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Groq AI Chatbot</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.app {
    width: 100%;
    max-width: 900px;
    height: 90vh;
    background: #ffffff;
    border-radius: 22px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 25px 70px rgba(0,0,0,.25);
}

/* HEADER */

.header {
    height: 75px;
    padding: 12px 20px;
    border-bottom: 1px solid #eee;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 48px;
    height: 48px;
    border-radius: 50%;

    background: linear-gradient(135deg,#667eea,#764ba2);

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 24px;
}

.title {
    font-size: 18px;
    font-weight: bold;
}

.status {
    margin-top: 4px;
    color: #22a05a;
    font-size: 12px;
}

.clear-btn {
    border: none;
    background: #f1f3f5;
    border-radius: 10px;
    padding: 10px 12px;
    cursor: pointer;
    font-size: 18px;
}

.clear-btn:hover {
    background: #e5e7eb;
}

/* CHAT */

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
    background: #f6f7fb;
}

.message {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    max-width: 85%;
}

.message.user {
    margin-left: auto;
    flex-direction: row-reverse;
}

.avatar {
    width: 38px;
    height: 38px;
    min-width: 38px;

    border-radius: 50%;

    background: #667eea;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 18px;
}

.message-content {
    display: flex;
    flex-direction: column;
}

.user .message-content {
    align-items: flex-end;
}

.bubble {
    padding: 13px 17px;

    border-radius: 17px;

    font-size: 15px;
    line-height: 1.55;

    word-break: break-word;
    white-space: pre-wrap;
}

.bot .bubble {
    background: white;
    color: #222;

    border-top-left-radius: 4px;

    box-shadow: 0 2px 10px rgba(0,0,0,.05);
}

.user .bubble {
    background: #667eea;
    color: white;

    border-top-right-radius: 4px;
}

.time {
    margin-top: 5px;
    font-size: 10px;
    color: #999;
}

/* TYPING */

.typing {
    display: none;

    padding: 10px 25px;

    background: #f6f7fb;

    color: #777;

    font-size: 13px;
}

.typing.show {
    display: block;
}

/* INPUT */

.input-area {
    display: flex;
    gap: 10px;

    padding: 15px;

    border-top: 1px solid #eee;
}

.input {
    flex: 1;

    height: 50px;

    border: 1px solid #ddd;

    border-radius: 25px;

    padding: 0 18px;

    font-size: 15px;

    outline: none;
}

.input:focus {
    border-color: #667eea;
}

.send {
    width: 50px;
    height: 50px;

    border: none;

    border-radius: 50%;

    background: #667eea;

    color: white;

    font-size: 21px;

    cursor: pointer;
}

.send:hover {
    background: #5568d9;
}

.send:disabled {
    opacity: .5;
    cursor: not-allowed;
}

/* MOBILE */

@media(max-width:600px) {

    body {
        padding: 0;
    }

    .app {
        height: 100vh;
        border-radius: 0;
    }

    .chat {
        padding: 15px;
    }

    .message {
        max-width: 94%;
    }

}

</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div class="header-left">

            <div class="logo">
                🤖
            </div>

            <div>

                <div class="title">
                    My Groq AI
                </div>

                <div class="status">
                    ● AI Assistant
                </div>

            </div>

        </div>

        <button
            class="clear-btn"
            onclick="clearChat()"
            title="Clear chat"
        >
            🗑️
        </button>

    </header>


    <!-- CHAT -->

    <main
        class="chat"
        id="chat"
    >

        <div class="message bot">

            <div class="avatar">
                🤖
            </div>

            <div class="message-content">

                <div class="bubble">
                    Hello! 👋

                    I'm your AI assistant powered by Groq.

                    Ask me anything!
                </div>

                <div class="time">
                    Now
                </div>

            </div>

        </div>

    </main>


    <!-- TYPING -->

    <div
        class="typing"
        id="typing"
    >
        🤖 AI is thinking...
    </div>


    <!-- INPUT -->

    <div class="input-area">

        <input
            id="input"
            class="input"
            type="text"
            placeholder="Message your AI..."
            autocomplete="off"
        >

        <button
            id="send"
            class="send"
            onclick="sendMessage()"
        >
            ➤
        </button>

    </div>

</div>


<script>

/*
==================================================
 IMPORTANT
==================================================

DO NOT publish your real API key in GitHub.

Anyone can inspect this file and obtain the key.

For a temporary private test, replace the
placeholder below with a NEW rotated key.

For a real public GitHub Pages website,
use a backend/proxy instead.
==================================================
*/


const GROQ_API_KEY = "YOUR_NEW_GROQ_API_KEY";


/*
==================================================
 SETTINGS
==================================================
*/

const MODEL = "llama-3.3-70b-versatile";

const API_URL =
    "https://api.groq.com/openai/v1/chat/completions";


/*
==================================================
 ELEMENTS
==================================================
*/

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("input");

const send =
    document.getElementById("send");

const typing =
    document.getElementById("typing");


/*
==================================================
 CONVERSATION
==================================================
*/

let conversation = [];


/*
==================================================
 ENTER KEY
==================================================
*/

input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        sendMessage();

    }

});


/*
==================================================
 SEND MESSAGE
==================================================
*/

async function sendMessage() {

    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    if (
        !GROQ_API_KEY ||
        GROQ_API_KEY === "YOUR_NEW_GROQ_API_KEY"
    ) {

        addMessage(
            "bot",
            "⚠️ Please add your Groq API key in the JavaScript section first."
        );

        return;
    }


    /*
    Add user message
    */

    addMessage(
        "user",
        text
    );


    input.value = "";


    /*
    Add to conversation
    */

    conversation.push({

        role: "user",

        content: text

    });


    /*
    UI
    */

    send.disabled = true;

    typing.classList.add("show");


    try {

        /*
        Call Groq
        */

        const response =
            await fetch(
                API_URL,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            GROQ_API_KEY

                    },

                    body:
                        JSON.stringify({

                            model: MODEL,

                            messages: [

                                {
                                    role: "system",

                                    content:
                                        "You are a helpful, friendly and accurate AI assistant. Give clear answers and use simple formatting."
                                },

                                ...conversation

                            ],

                            temperature: 0.7,

                            max_tokens: 2048

                        })

                }
            );


        /*
        Read response
        */

        const data =
            await response.json();


        if (!response.ok) {

            console.error(
                "Groq error:",
                data
            );

            throw new Error(
                data?.error?.message ||
                "Groq API request failed"
            );

        }


        /*
        Get AI response
        */

        const reply =
            data?.choices?.[0]?.message?.content;


        if (!reply) {

            throw new Error(
                "No response received from Groq."
            );

        }


        /*
        Save assistant response
        */

        conversation.push({

            role: "assistant",

            content: reply

        });


        /*
        Show response
        */

        addMessage(
            "bot",
            reply
        );


    }

    catch (error) {

        console.error(error);

        addMessage(
            "bot",
            "❌ Error: " +
            error.message
        );

    }

    finally {

        typing.classList.remove("show");

        send.disabled = false;

        input.focus();

    }

}


/*
==================================================
 ADD MESSAGE
==================================================
*/

function addMessage(
    sender,
    text
) {

    const message =
        document.createElement("div");


    message.className =
        "message " +
        sender;


    /*
    Avatar
    */

    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar";

    avatar.textContent =
        sender === "user"
        ? "👤"
        : "🤖";


    /*
    Content
    */

    const content =
        document.createElement("div");

    content.className =
        "message-content";


    /*
    Bubble
    */

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";


    /*
    textContent prevents
    arbitrary HTML injection.
    */

    bubble.textContent =
        text;


    /*
    Time
    */

    const time =
        document.createElement("div");

    time.className =
        "time";

    time.textContent =
        new Date()
        .toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    /*
    Build
    */

    content.appendChild(
        bubble
    );

    content.appendChild(
        time
    );

    message.appendChild(
        avatar
    );

    message.appendChild(
        content
    );

    chat.appendChild(
        message
    );


    /*
    Scroll
    */

    chat.scrollTop =
        chat.scrollHeight;

}


/*
==================================================
 CLEAR CHAT
==================================================
*/

function clearChat() {

    conversation = [];

    chat.innerHTML = "";


    addMessage(
        "bot",
        "Chat cleared! 👋 Ask me anything."
    );

}


/*
==================================================
 INITIAL FOCUS
==================================================
*/

input.focus();

</script>

</body>
</html>
```

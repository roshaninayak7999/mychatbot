<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chatbot</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.chat-app {
    width: 95%;
    max-width: 850px;
    height: 92vh;
    background: white;
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
}

/* Header */
.header {
    background: #ffffff;
    border-bottom: 1px solid #eee;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: linear-gradient(135deg,#667eea,#764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 22px;
}

.title {
    font-size: 18px;
    font-weight: bold;
}

.status {
    color: #20a05a;
    font-size: 12px;
    margin-top: 3px;
}

.clear-btn {
    border: 0;
    background: #f1f3f5;
    padding: 10px 14px;
    border-radius: 10px;
    cursor: pointer;
}

.clear-btn:hover {
    background: #e5e7eb;
}

/* Messages */
.messages {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
    background: #f6f7fb;
}

.message {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    max-width: 85%;
}

.message.user {
    margin-left: auto;
    flex-direction: row-reverse;
}

.avatar {
    width: 38px;
    height: 38px;
    min-width: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #667eea;
    color: white;
}

.message.user .avatar {
    background: #333;
}

.message-content {
    display: flex;
    flex-direction: column;
}

.message.user .message-content {
    align-items: flex-end;
}

.bubble {
    padding: 13px 17px;
    border-radius: 17px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
}

.message.bot .bubble {
    background: white;
    color: #222;
    border-top-left-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.message.user .bubble {
    background: #667eea;
    color: white;
    border-top-right-radius: 4px;
}

.time {
    font-size: 10px;
    color: #999;
    margin-top: 5px;
}

/* Typing */
.typing {
    display: none;
    padding: 8px 25px;
    background: #f6f7fb;
    color: #777;
    font-size: 13px;
}

.typing.show {
    display: block;
}

/* Input */
.input-area {
    padding: 15px;
    border-top: 1px solid #eee;
    display: flex;
    gap: 10px;
    background: white;
}

.input {
    flex: 1;
    border: 1px solid #ddd;
    outline: none;
    border-radius: 25px;
    padding: 0 18px;
    height: 50px;
    font-size: 15px;
}

.input:focus {
    border-color: #667eea;
}

.send-btn {
    width: 50px;
    height: 50px;
    border: none;
    border-radius: 50%;
    background: #667eea;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.send-btn:hover {
    background: #5568d9;
}

.send-btn:disabled {
    opacity: .5;
    cursor: not-allowed;
}

/* Mobile */
@media (max-width: 600px) {

    body {
        align-items: stretch;
    }

    .chat-app {
        width: 100%;
        height: 100vh;
        border-radius: 0;
    }

    .messages {
        padding: 15px;
    }

    .message {
        max-width: 92%;
    }
}
</style>
</head>

<body>

<div class="chat-app">

    <div class="header">

        <div class="logo-area">

            <div class="logo">🤖</div>

            <div>
                <div class="title">My AI Chatbot</div>
                <div class="status">● Online</div>
            </div>

        </div>

        <button class="clear-btn" onclick="clearChat()">
            🗑️ Clear
        </button>

    </div>


    <div class="messages" id="messages">

        <div class="message bot">

            <div class="avatar">🤖</div>

            <div class="message-content">

                <div class="bubble">Hello! 👋

I'm your AI assistant. Ask me anything!</div>

                <div class="time">Now</div>

            </div>

        </div>

    </div>


    <div class="typing" id="typing">
        🤖 AI is thinking...
    </div>


    <div class="input-area">

        <input
            id="userInput"
            class="input"
            type="text"
            placeholder="Type your message..."
            autocomplete="off"
        >

        <button
            id="sendButton"
            class="send-btn"
            onclick="sendMessage()"
        >
            ➤
        </button>

    </div>

</div>


<script>

/*
====================================================
 GROQ API CONFIG
====================================================

IMPORTANT:
The API key you previously posted should be revoked.

Create a NEW key and put it below.

DO NOT publish a real API key in a public
GitHub Pages repository.
====================================================
*/

const GROQ_API_KEY = "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";

const GROQ_API_URL =
    "https://api.groq.com/openai/v1/chat/completions";

const MODEL =
    "llama-3.3-70b-versatile";


/*
====================================================
 ELEMENTS
====================================================
*/

const messages =
    document.getElementById("messages");

const userInput =
    document.getElementById("userInput");

const sendButton =
    document.getElementById("sendButton");

const typing =
    document.getElementById("typing");


/*
====================================================
 CONVERSATION MEMORY
====================================================
*/

let conversation = [];


/*
====================================================
 ENTER KEY
====================================================
*/

userInput.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        sendMessage();

    }

});


/*
====================================================
 SEND MESSAGE
====================================================
*/

async function sendMessage() {

    const text =
        userInput.value.trim();

    if (!text) {
        return;
    }


    if (
        GROQ_API_KEY === "YOUR_NEW_GROQ_API_KEY" ||
        !GROQ_API_KEY
    ) {

        addMessage(
            "bot",
            "⚠️ Please add your new Groq API key inside the code first."
        );

        return;
    }


    addMessage("user", text);

    userInput.value = "";

    conversation.push({
        role: "user",
        content: text
    });


    sendButton.disabled = true;

    typing.classList.add("show");


    try {

        const response =
            await fetch(
                GROQ_API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            GROQ_API_KEY
                    },

                    body: JSON.stringify({

                        model: MODEL,

                        messages: [

                            {
                                role: "system",

                                content:
                                    "You are a helpful, friendly AI assistant. Answer clearly, accurately and concisely."
                            },

                            ...conversation

                        ],

                        temperature: 0.7,

                        max_tokens: 2048

                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data?.error?.message ||
                "Groq API request failed."
            );

        }


        const answer =
            data?.choices?.[0]?.message?.content;


        if (!answer) {

            throw new Error(
                "No response was returned by the AI."
            );

        }


        conversation.push({
            role: "assistant",
            content: answer
        });


        addMessage(
            "bot",
            answer
        );


    } catch (error) {

        console.error(error);

        addMessage(
            "bot",
            "❌ Error: " + error.message
        );

    }


    typing.classList.remove("show");

    sendButton.disabled = false;

    userInput.focus();

}


/*
====================================================
 ADD MESSAGE
====================================================
*/

function addMessage(
    sender,
    text
) {

    const message =
        document.createElement("div");

    message.className =
        "message " + sender;


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar";

    avatar.textContent =
        sender === "user"
        ? "👤"
        : "🤖";


    const content =
        document.createElement("div");

    content.className =
        "message-content";


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.textContent =
        text;


    const time =
        document.createElement("div");

    time.className =
        "time";

    time.textContent =
        new Date().toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    content.appendChild(bubble);

    content.appendChild(time);

    message.appendChild(avatar);

    message.appendChild(content);

    messages.appendChild(message);


    messages.scrollTop =
        messages.scrollHeight;
}


/*
====================================================
 CLEAR CHAT
====================================================
*/

function clearChat() {

    conversation = [];

    messages.innerHTML = "";

    addMessage(
        "bot",
        "Chat cleared! 👋\n\nHow can I help you?"
    );

}


/*
====================================================
 START
====================================================
*/

userInput.focus();

</script>

</body>
</html>

 
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Chatbot</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: #fff;
      height: 100vh;
      height: 100dvh;
      display: grid;
      place-items: center;
    }

    .app {
      width: 100%;
      max-width: 850px;
      height: 100%;
      max-height: 850px;
      display: flex;
      flex-direction: column;
      background: #121a2d;
      border: 1px solid #29334b;
      border-radius: 18px;
      overflow: hidden;
    }

    header {
      padding: 18px;
      background: #18233a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #29334b;
    }

    h1 { font-size: 19px; margin: 0 0 5px; }
    .status { color: #8ce9b0; font-size: 12px; }

    button {
      cursor: pointer;
      font: inherit;
      border: none;
    }

    #clear {
      background: #293750;
      color: white;
      padding: 10px 12px;
      border-radius: 10px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .welcome {
      text-align: center;
      margin: auto 0;
      color: #c4cee1;
      line-height: 1.6;
    }

    .welcome h2 { color: white; }

    .message {
      max-width: 85%;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .avatar {
      min-width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: #293750;
    }

    .user .avatar { background: #6548e8; }

    .bubble {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.6;
      padding: 12px 15px;
      border-radius: 5px 15px 15px 15px;
      background: #202c43;
      font-size: 14px;
    }

    .user .bubble {
      background: #6548e8;
      border-radius: 15px 5px 15px 15px;
    }

    .suggestions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 20px;
    }

    .suggestions button {
      background: #202c43;
      color: white;
      border: 1px solid #35415b;
      padding: 10px;
      border-radius: 10px;
    }

    footer {
      padding: 15px;
      border-top: 1px solid #29334b;
    }

    form {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: #202c43;
      border: 1px solid #35415b;
      border-radius: 14px;
      padding: 8px;
    }

    textarea {
      flex: 1;
      min-width: 0;
      resize: none;
      max-height: 130px;
      background: transparent;
      color: white;
      border: none;
      outline: none;
      padding: 10px;
      font: inherit;
      line-height: 1.5;
    }

    textarea::placeholder { color: #a0aec5; }

    #send {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      color: white;
      background: #7559f5;
      font-size: 20px;
    }

    #send:disabled { opacity: .5; cursor: wait; }

    .hint {
      color: #8491aa;
      text-align: center;
      font-size: 11px;
      margin-top: 10px;
    }

    @media (max-width: 600px) {
      .app { border: 0; border-radius: 0; }
      #chat { padding: 15px; }
      .message { max-width: 96%; }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div>
        <h1>✦ My AI Assistant</h1>
        <div class="status">● Ready to chat</div>
      </div>
      <button id="clear" type="button">New chat</button>
    </header>

    <section id="chat" aria-live="polite">
      <div class="welcome" id="welcome">
        <div style="font-size:48px">🤖</div>
        <h2>How can I help you?</h2>
        <p>Ask anything. Let's explore ideas together.</p>
        <div class="suggestions">
          <button data-prompt="Explain artificial intelligence simply.">
            ✨ Explain AI
          </button>
          <button data-prompt="Give me a creative website idea.">
            💡 Website ideas
          </button>
          <button data-prompt="Teach me JavaScript for beginners.">
            💻 Learn coding
          </button>
        </div>
      </div>
    </section>

    <footer>
      <form id="form">
        <textarea id="prompt" rows="1" maxlength="10000"
          placeholder="Message your AI..." required></textarea>
        <button id="send" type="submit" aria-label="Send">➤</button>
      </form>
      <div class="hint">AI can make mistakes. Check important information.</div>
    </footer>
  </main>

  <script>
    // Enter your NEW Groq API key here for local testing only.
    const API_KEY = "PASTE_YOUR_NEW_GROQ_API_KEY_HERE";

    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("prompt");
    const send = document.getElementById("send");

    let messages = [];
    let busy = false;

    function addMessage(role, text) {
      const row = document.createElement("div");
      row.className = "message " + role;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "👤" : "✦";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      row.append(avatar, bubble);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;

      return row;
    }

    async function sendMessage(text) {
      text = text.trim();

      if (!text || busy) return;

      if (!API_KEY ||
          API_KEY === "PASTE_YOUR_NEW_GROQ_API_KEY_HERE") {
        alert("Please add your Groq API key in the JavaScript section.");
        return;
      }

      document.getElementById("welcome")?.remove();
      input.value = "";
      input.style.height = "auto";

      addMessage("user", text);
      messages.push({ role: "user", content: text });

      busy = true;
      send.disabled = true;

      const loading = addMessage("assistant", "Thinking...");

      try {
        const response = await fetch(
          "https://api.groq.com/openai/v1/chat/completions",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + API_KEY
            },
            body: JSON.stringify({
              model: "llama-3.3-70b-versatile",
              messages: [
                {
                  role: "system",
                  content: "You are a helpful, friendly AI assistant. Give clear and useful answers."
                },
                ...messages.slice(-20)
              ],
              temperature: 0.7,
              max_completion_tokens: 1024
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error?.message || "API request failed (" + response.status + ")"
          );
        }

        const reply = data.choices?.[0]?.message?.content;

        if (typeof reply !== "string") {
          throw new Error("No answer was returned by the AI.");
        }

        loading.querySelector(".bubble").textContent = reply;
        messages.push({ role: "assistant", content: reply });

      } catch (error) {
        loading.querySelector(".bubble").textContent =
          "Sorry, an error occurred: " + error.message;

        // Let the user retry the failed message.
        if (messages.at(-1)?.role === "user") messages.pop();

      } finally {
        busy = false;
        send.disabled = false;
        input.focus();
        chat.scrollTop = chat.scrollHeight;
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      sendMessage(input.value);
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 130) + "px";
    });

    input.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    document.querySelectorAll("[data-prompt]").forEach(button => {
      button.addEventListener("click", () => {
        sendMessage(button.dataset.prompt);
      });
    });

    document.getElementById("clear").addEventListener("click", () => {
      if (busy) return;

      messages = [];
      chat.replaceChildren();

      const welcome = document.createElement("div");
      welcome.className = "welcome";
      welcome.id = "welcome";
      welcome.innerHTML =
        "<div style='font-size:48px'>🤖</div>" +
        "<h2>New conversation</h2>" +
        "<p>What would you like to talk about?</p>";

      chat.appendChild(welcome);
      input.focus();
    });
  </script>
</body>
</html>

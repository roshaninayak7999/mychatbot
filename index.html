<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI Chatbot</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.chat-app {
    width: 95%;
    max-width: 850px;
    height: 92vh;
    background: white;
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
}

/* HEADER */
.header {
    padding: 15px 20px;
    border-bottom: 1px solid #eee;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: linear-gradient(135deg,#667eea,#764ba2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
}

.title {
    font-size: 18px;
    font-weight: bold;
}

.status {
    color: #20a05a;
    font-size: 12px;
    margin-top: 3px;
}

.header-buttons {
    display: flex;
    gap: 8px;
}

.header-btn {
    border: 0;
    background: #f1f3f5;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
}

.header-btn:hover {
    background: #e5e7eb;
}

/* CHAT */
.messages {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
    background: #f6f7fb;
}

.message {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    max-width: 85%;
}

.message.user {
    margin-left: auto;
    flex-direction: row-reverse;
}

.avatar {
    width: 38px;
    height: 38px;
    min-width: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #667eea;
    color: white;
}

.message.user .avatar {
    background: #333;
}

.message-content {
    display: flex;
    flex-direction: column;
}

.message.user .message-content {
    align-items: flex-end;
}

.bubble {
    padding: 13px 17px;
    border-radius: 17px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
}

.message.bot .bubble {
    background: white;
    color: #222;
    border-top-left-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.message.user .bubble {
    background: #667eea;
    color: white;
    border-top-right-radius: 4px;
}

.time {
    font-size: 10px;
    color: #999;
    margin-top: 5px;
}

/* TYPING */
.typing {
    display: none;
    padding: 8px 25px;
    background: #f6f7fb;
    color: #777;
    font-size: 13px;
}

.typing.show {
    display: block;
}

/* INPUT */
.input-area {
    padding: 15px;
    border-top: 1px solid #eee;
    display: flex;
    gap: 10px;
}

.input {
    flex: 1;
    height: 50px;
    border: 1px solid #ddd;
    outline: none;
    border-radius: 25px;
    padding: 0 18px;
    font-size: 15px;
}

.input:focus {
    border-color: #667eea;
}

.send-btn {
    width: 50px;
    height: 50px;
    border: none;
    border-radius: 50%;
    background: #667eea;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.send-btn:hover {
    background: #5568d9;
}

.send-btn:disabled {
    opacity: .5;
    cursor: not-allowed;
}

/* SETTINGS */
.settings-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

.settings-box {
    width: 90%;
    max-width: 500px;
    background: white;
    border-radius: 18px;
    padding: 25px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
}

.settings-box h2 {
    margin-bottom: 10px;
}

.settings-box p {
    color: #666;
    line-height: 1.5;
    font-size: 14px;
    margin-bottom: 15px;
}

.api-input {
    width: 100%;
    height: 45px;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 0 12px;
    outline: none;
    margin-bottom: 15px;
}

.api-input:focus {
    border-color: #667eea;
}

.settings-buttons {
    display: flex;
    gap: 10px;
}

.save-btn,
.close-btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.save-btn {
    background: #667eea;
    color: white;
}

.close-btn {
    background: #eee;
}

/* MOBILE */
@media (max-width: 600px) {

    body {
        align-items: stretch;
    }

    .chat-app {
        width: 100%;
        height: 100vh;
        border-radius: 0;
    }

    .messages {
        padding: 15px;
    }

    .message {
        max-width: 92%;
    }
}
</style>
</head>

<body>

<div class="chat-app">

    <div class="header">

        <div class="logo-area">

            <div class="logo">🤖</div>

            <div>
                <div class="title">My AI Chatbot</div>
                <div class="status" id="status">
                    ● API Key Not Set
                </div>
            </div>

        </div>

        <div class="header-buttons">

            <button
                class="header-btn"
                onclick="openSettings()">
                ⚙️
            </button>

            <button
                class="header-btn"
                onclick="clearChat()">
                🗑️
            </button>

        </div>

    </div>


    <div
        class="messages"
        id="messages">

        <div class="message bot">

            <div class="avatar">🤖</div>

            <div class="message-content">

                <div class="bubble">Hello! 👋

I'm your AI assistant powered by Groq.

Click ⚙️ to enter your API key, then ask me anything!</div>

                <div class="time">
                    Now
                </div>

            </div>

        </div>

    </div>


    <div
        class="typing"
        id="typing">

        🤖 AI is thinking...

    </div>


    <div class="input-area">

        <input
            id="userInput"
            class="input"
            type="text"
            placeholder="Type your message..."
            autocomplete="off">

        <button
            id="sendButton"
            class="send-btn"
            onclick="sendMessage()">

            ➤

        </button>

    </div>

</div>


<!-- SETTINGS -->

<div
    class="settings-overlay"
    id="settingsOverlay">

    <div class="settings-box">

        <h2>⚙️ API Settings</h2>

        <p>
            Enter your Groq API key. It is kept in this
            browser session and is not written into the
            HTML source.
        </p>

        <input
            id="apiKeyInput"
            class="api-input"
            type="password"
            placeholder="gsk_...">

        <div class="settings-buttons">

            <button
                class="save-btn"
                onclick="saveApiKey()">

                Save Key

            </button>

            <button
                class="close-btn"
                onclick="closeSettings()">

                Cancel

            </button>

        </div>

    </div>

</div>


<script>

/*
====================================================
 GROQ CONFIGURATION
====================================================
*/

const GROQ_API_URL =
    "https://api.groq.com/openai/v1/chat/completions";

const MODEL =
    "llama-3.3-70b-versatile";


/*
====================================================
 API KEY
====================================================

The key is entered through the Settings button.

We intentionally do NOT hard-code the exposed key
you previously posted.
====================================================
*/

let GROQ_API_KEY =
    sessionStorage.getItem("groq_api_key") || "";


/*
====================================================
 ELEMENTS
====================================================
*/

const messages =
    document.getElementById("messages");

const userInput =
    document.getElementById("userInput");

const sendButton =
    document.getElementById("sendButton");

const typing =
    document.getElementById("typing");

const status =
    document.getElementById("status");

const settingsOverlay =
    document.getElementById("settingsOverlay");

const apiKeyInput =
    document.getElementById("apiKeyInput");


/*
====================================================
 CONVERSATION
====================================================
*/

let conversation = [];


/*
====================================================
 STATUS
====================================================
*/

function updateStatus() {

    if (GROQ_API_KEY) {

        status.textContent =
            "● API Ready";

        status.style.color =
            "#20a05a";

    } else {

        status.textContent =
            "● API Key Not Set";

        status.style.color =
            "#d97706";
    }
}

updateStatus();


/*
====================================================
 SETTINGS
====================================================
*/

function openSettings() {

    apiKeyInput.value = GROQ_API_KEY;

    settingsOverlay.style.display =
        "flex";

    apiKeyInput.focus();
}


function closeSettings() {

    settingsOverlay.style.display =
        "none";
}


function saveApiKey() {

    const key =
        apiKeyInput.value.trim();

    if (!key) {

        alert("Please enter your Groq API key.");

        return;
    }


    GROQ_API_KEY = key;

    sessionStorage.setItem(
        "groq_api_key",
        key
    );


    updateStatus();

    closeSettings();

    addMessage(
        "bot",
        "✅ API key saved for this browser session. You can now send a message."
    );

}


/*
====================================================
 CLOSE SETTINGS WHEN CLICKING OUTSIDE
====================================================
*/

settingsOverlay.addEventListener(
    "click",
    function(event) {

        if (
            event.target ===
            settingsOverlay
        ) {

            closeSettings();

        }

    }
);


/*
====================================================
 ENTER KEY
====================================================
*/

userInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();

        }

    }
);


/*
====================================================
 SEND MESSAGE
====================================================
*/

async function sendMessage() {

    const text =
        userInput.value.trim();


    if (!text) {
        return;
    }


    if (!GROQ_API_KEY) {

        addMessage(
            "bot",
            "⚠️ Please click ⚙️ and enter your Groq API key first."
        );

        openSettings();

        return;
    }


    addMessage(
        "user",
        text
    );


    userInput.value = "";


    conversation.push({

        role: "user",

        content: text

    });


    sendButton.disabled = true;

    typing.classList.add("show");


    try {

        const response =
            await fetch(
                GROQ_API_URL,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            GROQ_API_KEY

                    },

                    body:
                        JSON.stringify({

                            model: MODEL,

                            messages: [

                                {
                                    role: "system",

                                    content:
                                        "You are a helpful, friendly AI assistant. Answer clearly, accurately and concisely."
                                },

                                ...conversation

                            ],

                            temperature: 0.7,

                            max_tokens: 2048

                        })

                }
            );


        let data;

        try {

            data =
                await response.json();

        } catch {

            throw new Error(
                "The API returned an invalid response."
            );

        }


        if (!response.ok) {

            throw new Error(
                data?.error?.message ||
                "Groq API request failed."
            );

        }


        const answer =
            data?.choices?.[0]?.message?.content;


        if (!answer) {

            throw new Error(
                "The AI returned an empty response."
            );

        }


        conversation.push({

            role: "assistant",

            content: answer

        });


        addMessage(
            "bot",
            answer
        );


    } catch (error) {

        console.error(
            "Groq error:",
            error
        );


        addMessage(
            "bot",
            "❌ " + error.message
        );

    }


    typing.classList.remove("show");

    sendButton.disabled = false;

    userInput.focus();

}


/*
====================================================
 ADD MESSAGE
====================================================
*/

function addMessage(
    sender,
    text
) {

    const message =
        document.createElement("div");


    message.className =
        "message " + sender;


    const avatar =
        document.createElement("div");


    avatar.className =
        "avatar";


    avatar.textContent =
        sender === "user"
        ? "👤"
        : "🤖";


    const content =
        document.createElement("div");


    content.className =
        "message-content";


    const bubble =
        document.createElement("div");


    bubble.className =
        "bubble";


    /*
    textContent prevents AI output
    from being interpreted as HTML.
    */

    bubble.textContent =
        text;


    const time =
        document.createElement("div");


    time.className =
        "time";


    time.textContent =
        new Date().toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    content.appendChild(
        bubble
    );

    content.appendChild(
        time
    );


    message.appendChild(
        avatar
    );

    message.appendChild(
        content
    );


    messages.appendChild(
        message
    );


    messages.scrollTop =
        messages.scrollHeight;
}


/*
====================================================
 CLEAR CHAT
====================================================
*/

function clearChat() {

    conversation = [];

    messages.innerHTML = "";


    addMessage(
        "bot",
        "Chat cleared! 👋\n\nHow can I help you?"
    );

}


/*
====================================================
 START
====================================================
*/

userInput.focus();

</script>

</body>
</html>

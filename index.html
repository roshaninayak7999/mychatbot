<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI Chatbot</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.app {
    width: 95%;
    max-width: 900px;
    height: 92vh;
    background: #fff;
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
}

/* HEADER */
.header {
    padding: 15px 20px;
    border-bottom: 1px solid #eee;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: linear-gradient(135deg,#667eea,#764ba2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
}

.title {
    font-size: 18px;
    font-weight: bold;
}

.status {
    font-size: 12px;
    margin-top: 3px;
    color: #d97706;
}

.buttons {
    display: flex;
    gap: 8px;
}

.header-btn {
    border: 0;
    background: #f1f3f5;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
}

.header-btn:hover {
    background: #e5e7eb;
}

/* CHAT */
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
    background: #f6f7fb;
}

.message {
    display: flex;
    gap: 10px;
    max-width: 85%;
    margin-bottom: 20px;
}

.message.user {
    margin-left: auto;
    flex-direction: row-reverse;
}

.avatar {
    width: 38px;
    height: 38px;
    min-width: 38px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #667eea;
}

.user .avatar {
    background: #333;
}

.content {
    display: flex;
    flex-direction: column;
}

.user .content {
    align-items: flex-end;
}

.bubble {
    padding: 13px 17px;
    border-radius: 17px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
}

.bot .bubble {
    background: white;
    color: #222;
    border-top-left-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.user .bubble {
    background: #667eea;
    color: white;
    border-top-right-radius: 4px;
}

.time {
    font-size: 10px;
    color: #999;
    margin-top: 5px;
}

/* TYPING */
.typing {
    display: none;
    padding: 8px 25px;
    background: #f6f7fb;
    color: #777;
    font-size: 13px;
}

.typing.show {
    display: block;
}

/* INPUT */
.input-area {
    padding: 15px;
    border-top: 1px solid #eee;
    display: flex;
    gap: 10px;
}

.input {
    flex: 1;
    height: 50px;
    border: 1px solid #ddd;
    outline: none;
    border-radius: 25px;
    padding: 0 18px;
    font-size: 15px;
}

.input:focus {
    border-color: #667eea;
}

.send {
    width: 50px;
    height: 50px;
    border: 0;
    border-radius: 50%;
    background: #667eea;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.send:disabled {
    opacity: .5;
}

/* SETTINGS */
.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    align-items: center;
    justify-content: center;
    z-index: 100;
}

.settings {
    width: 90%;
    max-width: 480px;
    background: white;
    border-radius: 18px;
    padding: 25px;
}

.settings h2 {
    margin-bottom: 10px;
}

.settings p {
    color: #666;
    line-height: 1.5;
    font-size: 14px;
    margin-bottom: 15px;
}

.key-input {
    width: 100%;
    height: 46px;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 0 12px;
    outline: none;
    margin-bottom: 15px;
}

.key-input:focus {
    border-color: #667eea;
}

.settings-actions {
    display: flex;
    gap: 10px;
}

.save,
.cancel {
    flex: 1;
    border: 0;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
}

.save {
    background: #667eea;
    color: white;
}

.cancel {
    background: #eee;
}

/* MOBILE */
@media(max-width:600px) {
    body {
        align-items: stretch;
    }

    .app {
        width: 100%;
        height: 100vh;
        border-radius: 0;
    }

    .chat {
        padding: 15px;
    }

    .message {
        max-width: 94%;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="brand">

            <div class="logo">🤖</div>

            <div>
                <div class="title">My AI Chatbot</div>
                <div class="status" id="status">
                    ● API Key Not Set
                </div>
            </div>

        </div>

        <div class="buttons">

            <button
                class="header-btn"
                onclick="openSettings()">
                ⚙️
            </button>

            <button
                class="header-btn"
                onclick="clearChat()">
                🗑️
            </button>

        </div>

    </header>


    <main
        class="chat"
        id="chat">

        <div class="message bot">

            <div class="avatar">🤖</div>

            <div class="content">

                <div class="bubble">Hello! 👋

I'm your AI assistant powered by Groq.

Click ⚙️ to add your API key, then send me a message.</div>

                <div class="time">Now</div>

            </div>

        </div>

    </main>


    <div
        class="typing"
        id="typing">
        🤖 AI is thinking...
    </div>


    <div class="input-area">

        <input
            id="input"
            class="input"
            type="text"
            placeholder="Message your AI..."
            autocomplete="off">

        <button
            id="send"
            class="send"
            onclick="sendMessage()">
            ➤
        </button>

    </div>

</div>


<!-- API KEY SETTINGS -->

<div
    class="overlay"
    id="overlay">

    <div class="settings">

        <h2>⚙️ Groq API Settings</h2>

        <p>
            Enter your newly rotated Groq API key.
            The key is kept only in this browser session.
        </p>

        <input
            id="keyInput"
            class="key-input"
            type="password"
            placeholder="gsk_...">

        <div class="settings-actions">

            <button
                class="save"
                onclick="saveKey()">
                Save Key
            </button>

            <button
                class="cancel"
                onclick="closeSettings()">
                Cancel
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================
   GROQ CONFIG
========================================= */

const API_URL =
    "https://api.groq.com/openai/v1/chat/completions";

const MODEL =
    "llama-3.3-70b-versatile";


/* =========================================
   API KEY
========================================= */

let GROQ_API_KEY =
    sessionStorage.getItem("groq_api_key") || "";


/* =========================================
   ELEMENTS
========================================= */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("input");

const send =
    document.getElementById("send");

const typing =
    document.getElementById("typing");

const status =
    document.getElementById("status");

const overlay =
    document.getElementById("overlay");

const keyInput =
    document.getElementById("keyInput");


/* =========================================
   CHAT MEMORY
========================================= */

let conversation = [];


/* =========================================
   STATUS
========================================= */

function updateStatus() {

    if (GROQ_API_KEY) {

        status.textContent = "● API Ready";
        status.style.color = "#20a05a";

    } else {

        status.textContent = "● API Key Not Set";
        status.style.color = "#d97706";

    }
}

updateStatus();


/* =========================================
   SETTINGS
========================================= */

function openSettings() {

    keyInput.value = "";

    overlay.style.display = "flex";

    keyInput.focus();
}


function closeSettings() {

    overlay.style.display = "none";
}


function saveKey() {

    const key =
        keyInput.value.trim();

    if (!key) {

        alert("Please enter your Groq API key.");

        return;
    }

    GROQ_API_KEY = key;

    sessionStorage.setItem(
        "groq_api_key",
        key
    );

    updateStatus();

    closeSettings();

    addMessage(
        "bot",
        "✅ API key saved. You can now chat with the AI."
    );
}


/* =========================================
   CLOSE MODAL
========================================= */

overlay.addEventListener(
    "click",
    function(event) {

        if (event.target === overlay) {
            closeSettings();
        }

    }
);


/* =========================================
   ENTER KEY
========================================= */

input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================
   SEND MESSAGE
========================================= */

async function sendMessage() {

    const text =
        input.value.trim();

    if (!text) {
        return;
    }


    if (!GROQ_API_KEY) {

        addMessage(
            "bot",
            "⚠️ Please click ⚙️ and enter your Groq API key first."
        );

        openSettings();

        return;
    }


    addMessage(
        "user",
        text
    );

    input.value = "";


    conversation.push({
        role: "user",
        content: text
    });


    send.disabled = true;

    typing.classList.add("show");


    try {

        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            GROQ_API_KEY
                    },

                    body:
                        JSON.stringify({

                            model: MODEL,

                            messages: [

                                {
                                    role: "system",

                                    content:
                                        "You are a helpful AI assistant. Answer clearly, accurately and naturally."
                                },

                                ...conversation

                            ],

                            temperature: 0.7,

                            max_tokens: 2048
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data?.error?.message ||
                "Groq API request failed."
            );
        }


        const answer =
            data?.choices?.[0]?.message?.content;


        if (!answer) {

            throw new Error(
                "The AI returned no response."
            );
        }


        conversation.push({
            role: "assistant",
            content: answer
        });


        addMessage(
            "bot",
            answer
        );


    } catch (error) {

        console.error(error);

        addMessage(
            "bot",
            "❌ " + error.message
        );

    }


    typing.classList.remove("show");

    send.disabled = false;

    input.focus();
}


/* =========================================
   ADD MESSAGE
========================================= */

function addMessage(
    sender,
    text
) {

    const message =
        document.createElement("div");

    message.className =
        "message " + sender;


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar";

    avatar.textContent =
        sender === "user"
        ? "👤"
        : "🤖";


    const content =
        document.createElement("div");

    content.className =
        "content";


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.textContent =
        text;


    const time =
        document.createElement("div");

    time.className =
        "time";

    time.textContent =
        new Date().toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    content.appendChild(bubble);
    content.appendChild(time);

    message.appendChild(avatar);
    message.appendChild(content);

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================================
   CLEAR CHAT
========================================= */

function clearChat() {

    conversation = [];

    chat.innerHTML = "";

    addMessage(
        "bot",
        "Chat cleared! 👋\n\nHow can I help you?"
    );
}


/* =========================================
   START
========================================= */

input.focus();

</script>

</body>
</html>

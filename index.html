
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Chatbot</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.chat-app {
    width: 100%;
    max-width: 800px;
    height: 90vh;
    max-height: 800px;
    background: #fff;
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
}

/* HEADER */
.header {
    height: 75px;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #eee;
    background: white;
}

.bot-info {
    display: flex;
    align-items: center;
    gap: 12px;
}

.bot-avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: #667eea;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
}

.header h1 {
    font-size: 18px;
    color: #222;
}

.status {
    font-size: 12px;
    color: #777;
    margin-top: 3px;
    display: flex;
    align-items: center;
    gap: 5px;
}

.status-dot {
    width: 8px;
    height: 8px;
    background: #22c55e;
    border-radius: 50%;
}

.clear-btn {
    border: 0;
    background: transparent;
    font-size: 20px;
    cursor: pointer;
    padding: 10px;
    border-radius: 10px;
}

.clear-btn:hover {
    background: #f1f1f1;
}

/* CHAT */
.chat-box {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
    background: #f7f8fc;
}

.message {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    max-width: 80%;
}

.user-message {
    margin-left: auto;
    flex-direction: row-reverse;
}

.avatar {
    width: 36px;
    height: 36px;
    min-width: 36px;
    border-radius: 50%;
    background: #667eea;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
}

.message-content {
    display: flex;
    flex-direction: column;
}

.user-message .message-content {
    align-items: flex-end;
}

.bubble {
    padding: 12px 16px;
    border-radius: 16px;
    line-height: 1.5;
    font-size: 15px;
    word-break: break-word;
}

.bot-message .bubble {
    background: white;
    color: #333;
    border-top-left-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,.05);
}

.user-message .bubble {
    background: #667eea;
    color: white;
    border-top-right-radius: 4px;
}

.time {
    color: #999;
    font-size: 10px;
    margin-top: 5px;
    padding: 0 4px;
}

/* TYPING */
.typing {
    padding: 8px 25px;
    background: #f7f8fc;
    display: flex;
    align-items: center;
    gap: 5px;
}

.typing span {
    width: 7px;
    height: 7px;
    background: #999;
    border-radius: 50%;
    animation: typing 1.2s infinite;
}

.typing span:nth-child(2) {
    animation-delay: .2s;
}

.typing span:nth-child(3) {
    animation-delay: .4s;
}

.typing small {
    margin-left: 5px;
    color: #888;
}

.hidden {
    display: none;
}

@keyframes typing {
    0%, 60%, 100% {
        transform: translateY(0);
    }

    30% {
        transform: translateY(-5px);
    }
}

/* INPUT */
.input-area {
    display: flex;
    gap: 10px;
    padding: 15px 20px;
    border-top: 1px solid #eee;
    background: white;
}

#messageInput {
    flex: 1;
    height: 48px;
    border: 1px solid #ddd;
    border-radius: 25px;
    padding: 0 18px;
    outline: none;
    font-size: 15px;
}

#messageInput:focus {
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102,126,234,.1);
}

.send-btn {
    width: 48px;
    height: 48px;
    border: 0;
    border-radius: 50%;
    background: #667eea;
    color: white;
    font-size: 20px;
    cursor: pointer;
    transition: .2s;
}

.send-btn:hover {
    background: #5568d9;
    transform: scale(1.05);
}

.footer {
    text-align: center;
    color: #999;
    font-size: 10px;
    padding: 6px;
    background: white;
}

/* MOBILE */
@media(max-width:600px) {
    body {
        padding: 0;
    }

    .chat-app {
        height: 100vh;
        max-height: none;
        border-radius: 0;
    }

    .chat-box {
        padding: 15px;
    }

    .message {
        max-width: 90%;
    }

    .input-area {
        padding: 10px;
    }
}
</style>
</head>

<body>

<div class="chat-app">

    <!-- HEADER -->
    <header class="header">

        <div class="bot-info">

            <div class="bot-avatar">
                🤖
            </div>

            <div>
                <h1>My Chatbot</h1>

                <div class="status">
                    <span class="status-dot"></span>
                    Online
                </div>
            </div>

        </div>

        <button class="clear-btn" id="clearBtn">
            🗑️
        </button>

    </header>


    <!-- CHAT -->
    <main class="chat-box" id="chatBox">

        <div class="message bot-message">

            <div class="avatar">
                🤖
            </div>

            <div class="message-content">

                <div class="bubble">
                    Hello! 👋<br><br>
                    I'm your chatbot. How can I help you?
                </div>

                <div class="time">
                    Now
                </div>

            </div>

        </div>

    </main>


    <!-- TYPING -->
    <div class="typing hidden" id="typing">

        <span></span>
        <span></span>
        <span></span>

        <small>Bot is typing...</small>

    </div>


    <!-- INPUT -->
    <div class="input-area">

        <input
            id="messageInput"
            type="text"
            placeholder="Type your message..."
            autocomplete="off"
        >

        <button
            id="sendBtn"
            class="send-btn"
        >
            ➤
        </button>

    </div>


    <div class="footer">
        Powered by My Chatbot
    </div>

</div>


<script>

/* ================================
   ELEMENTS
================================ */

const chatBox = document.getElementById("chatBox");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const clearBtn = document.getElementById("clearBtn");
const typing = document.getElementById("typing");


/* ================================
   START
================================ */

window.addEventListener("load", function() {

    loadMessages();

    messageInput.focus();

});


/* ================================
   SEND BUTTON
================================ */

sendBtn.addEventListener("click", function() {

    sendMessage();

});


/* ================================
   ENTER KEY
================================ */

messageInput.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        sendMessage();

    }

});


/* ================================
   CLEAR CHAT
================================ */

clearBtn.addEventListener("click", function() {

    localStorage.removeItem("chatMessages");

    chatBox.innerHTML = "";

    addMessage(
        "bot",
        "Chat cleared! 🧹<br><br>How can I help you?"
    );

});


/* ================================
   SEND MESSAGE
================================ */

function sendMessage() {

    const message = messageInput.value.trim();

    if (!message) {
        return;
    }

    addMessage("user", message);

    messageInput.value = "";

    showTyping();

    setTimeout(function() {

        hideTyping();

        const response = getBotResponse(message);

        addMessage("bot", response);

    }, 700);

}


/* ================================
   ADD MESSAGE
================================ */

function addMessage(sender, text, save = true) {

    const message = document.createElement("div");

    message.className =
        sender === "user"
        ? "message user-message"
        : "message bot-message";


    const avatar = document.createElement("div");

    avatar.className = "avatar";

    avatar.textContent =
        sender === "user"
        ? "👤"
        : "🤖";


    const content = document.createElement("div");

    content.className = "message-content";


    const bubble = document.createElement("div");

    bubble.className = "bubble";

    bubble.innerHTML = formatText(text);


    const time = document.createElement("div");

    time.className = "time";

    time.textContent = getTime();


    content.appendChild(bubble);

    content.appendChild(time);

    message.appendChild(avatar);

    message.appendChild(content);

    chatBox.appendChild(message);


    if (save) {

        saveMessage(sender, text);

    }


    scrollToBottom();

}


/* ================================
   BOT BRAIN
================================ */

function getBotResponse(message) {

    const text = message.toLowerCase().trim();


    /* GREETING */

    if (
        text === "hi" ||
        text === "hello" ||
        text === "hey" ||
        text.includes("good morning") ||
        text.includes("good evening")
    ) {

        return "Hello! 👋<br><br>Nice to meet you! How can I help you today?";

    }


    /* NAME */

    if (
        text.includes("your name") ||
        text.includes("who are you")
    ) {

        return "I'm <b>My Chatbot</b> 🤖, a chatbot made using HTML, CSS and JavaScript.";

    }


    /* CREATOR */

    if (
        text.includes("who made you") ||
        text.includes("who created you")
    ) {

        return "I was created using HTML, CSS and JavaScript and hosted on GitHub Pages.";

    }


    /* HOW ARE YOU */

    if (text.includes("how are you")) {

        return "I'm doing great! 😄 Thanks for asking.";

    }


    /* HELP */

    if (text === "help" || text.includes("can you help")) {

        return "Of course! 😊<br><br>You can ask me things like:<br>• What is your name?<br>• What can you do?<br>• What time is it?<br>• What is today's date?";

    }


    /* CAPABILITIES */

    if (
        text.includes("what can you do") ||
        text.includes("your capabilities")
    ) {

        return "I'm currently a simple browser chatbot. I can respond to common questions, remember your chat on this device, show the time and date, and more.";

    }


    /* TIME */

    if (
        text === "time" ||
        text.includes("what time")
    ) {

        return "The current time is <b>" +
            getTime() +
            "</b>. ⏰";

    }


    /* DATE */

    if (
        text === "date" ||
        text.includes("what date") ||
        text.includes("today's date")
    ) {

        return "Today's date is <b>" +
            new Date().toLocaleDateString() +
            "</b>. 📅";

    }


    /* DAY */

    if (text.includes("what day")) {

        return "Today is <b>" +
            new Date().toLocaleDateString(
                undefined,
                { weekday: "long" }
            ) +
            "</b>.";

    }


    /* THANKS */

    if (
        text.includes("thank you") ||
        text.includes("thanks")
    ) {

        return "You're very welcome! 😊";

    }


    /* BYE */

    if (
        text === "bye" ||
        text.includes("goodbye")
    ) {

        return "Goodbye! 👋 Have a great day!";

    }


    /* JOKE */

    if (
        text.includes("joke") ||
        text.includes("make me laugh")
    ) {

        return "Why did the computer go to the doctor? 🤔<br><br>Because it had a virus! 😂";

    }


    /* LOVE */

    if (
        text.includes("i love you")
    ) {

        return "Aww! 😊 I'm glad you're enjoying the chat!";

    }


    /* WEATHER */

    if (text.includes("weather")) {

        return "I don't have live weather data in this version. 🌤️ You can connect a weather API later to make me show real-time weather.";

    }


    /* DEFAULT */

    return "Interesting! 🤔<br><br>" +
           "I'm still a basic chatbot, so I don't understand every question yet. " +
           "Try asking me about my name, capabilities, the time, date, or tell me a joke.";


}


/* ================================
   FORMAT TEXT
================================ */

function formatText(text) {

    /*
       Escape user text so HTML cannot be injected.
       Then restore only the <br> and <b> tags
       generated by our own bot responses.
    */

    if (text.includes("<br>") || text.includes("<b>")) {

        return text;

    }

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML.replace(/\n/g, "<br>");

}


/* ================================
   TIME
================================ */

function getTime() {

    return new Date().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
    });

}


/* ================================
   TYPING
================================ */

function showTyping() {

    typing.classList.remove("hidden");

    scrollToBottom();

}


function hideTyping() {

    typing.classList.add("hidden");

}


/* ================================
   SCROLL
================================ */

function scrollToBottom() {

    setTimeout(function() {

        chatBox.scrollTop =
            chatBox.scrollHeight;

    }, 50);

}


/* ================================
   SAVE CHAT
================================ */

function saveMessage(sender, text) {

    let messages =
        JSON.parse(
            localStorage.getItem("chatMessages")
        ) || [];


    messages.push({

        sender: sender,

        text: text,

        time: new Date().toISOString()

    });


    /*
       Keep the last 100 messages
    */

    if (messages.length > 100) {

        messages =
            messages.slice(-100);

    }


    localStorage.setItem(
        "chatMessages",
        JSON.stringify(messages)
    );

}


/* ================================
   LOAD CHAT
================================ */

function loadMessages() {

    const messages =
        JSON.parse(
            localStorage.getItem("chatMessages")
        ) || [];


    if (messages.length === 0) {

        return;

    }


    /*
       Remove welcome message
    */

    chatBox.innerHTML = "";


    messages.forEach(function(message) {

        addOldMessage(
            message.sender,
            message.text,
            message.time
        );

    });


    scrollToBottom();

}


/* ================================
   OLD MESSAGE
================================ */

function addOldMessage(sender, text, savedTime) {

    const message =
        document.createElement("div");


    message.className =
        sender === "user"
        ? "message user-message"
        : "message bot-message";


    const avatar =
        document.createElement("div");

    avatar.className = "avatar";

    avatar.textContent =
        sender === "user"
        ? "👤"
        : "🤖";


    const content =
        document.createElement("div");

    content.className =
        "message-content";


    const bubble =
        document.createElement("div");

    bubble.className = "bubble";

    bubble.innerHTML =
        formatText(text);


    const time =
        document.createElement("div");

    time.className = "time";

    time.textContent =
        new Date(savedTime).toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    content.appendChild(bubble);

    content.appendChild(time);

    message.appendChild(avatar);

    message.appendChild(content);

    chatBox.appendChild(message);

}


/* ================================
   FOCUS INPUT
================================ */

messageInput.focus();

</script>

</body>
</html>
